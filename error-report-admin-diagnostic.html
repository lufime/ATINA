<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico HTTP — ATINA Reports</title>
<style>body{font:16px system-ui;background:#0b1421;color:#eef2f7;margin:0;padding:24px}main{max-width:800px;margin:auto}button{padding:12px 18px;background:#d3ad68;color:#101a28;border:0;border-radius:8px;font-weight:700;cursor:pointer}pre{background:#14243a;border:1px solid #36516e;border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aab6c5}</style></head>
<body><main><h1>Diagnóstico HTTP — Reports</h1><p class="muted">Teste isolado, somente OPTIONS e GET. Não altera dados.</p><button id="run">Executar diagnóstico</button><pre id="out">Pronto.</pre></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://qvvlqrgbtjujsejvenld.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dmxxcmdidGp1anNlanZlbmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODMzMDksImV4cCI6MjEwOTA1OTMwOX0.k_3Q05KxqmAByJgPxDyWeWPnYYfkrPxkRjd60Bntn6w";
const endpoint=URL+"/functions/v1/atina-error-reports-admin";
const out=document.querySelector("#out");
const log=(s)=>out.textContent+=s+"\\n";
document.querySelector("#run").onclick=async()=>{
out.textContent="Início do teste…\\n";
try{
 const client=window.supabase.createClient(URL,KEY);
 const {data:{session},error:sessionError}=await client.auth.getSession();
 log("Sessão: "+(session?"encontrada":"não encontrada")+(sessionError?" — "+sessionError.message:""));
 log("Endpoint: "+endpoint);
 try{
  const r=await fetch(endpoint,{method:"OPTIONS",headers:{"Origin":location.origin,"Access-Control-Request-Method":"GET","Access-Control-Request-Headers":"authorization,apikey"}});
  log("OPTIONS status: "+r.status+" "+r.statusText);
  log("OPTIONS headers: "+JSON.stringify(Object.fromEntries(["access-control-allow-origin","access-control-allow-methods","access-control-allow-headers","access-control-max-age"].map(h=>[h,r.headers.get(h)]))));
 }catch(e){log("OPTIONS falhou: "+e.name+" — "+e.message);}
 if(!session){log("GET ignorado: iniciar sessão de administrador na página admin e executar novamente.");return;}
 try{
  const r=await fetch(endpoint,{method:"GET",headers:{"Authorization":"Bearer "+session.access_token,"apikey":KEY}});
  const body=await r.text();
  log("GET status: "+r.status+" "+r.statusText);
  log("GET CORS origin: "+r.headers.get("access-control-allow-origin"));
  log("GET content-type: "+r.headers.get("content-type"));
  log("GET body (limitado): "+body.slice(0,1000));
 }catch(e){log("GET falhou: "+e.name+" — "+e.message);}
};
</script></body></html>
