<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14243a">
<title>ATINA — Administração de imagens</title>
<style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#14243a;--line:#36516e;--gold:#d3ad68;--text:#f3f0e8;--muted:#aab6c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3049,#0b1421 65%);color:var(--text);font:16px system-ui,sans-serif;min-height:100vh;padding:20px 12px}
main{max-width:620px;margin:auto}.panel{background:#122238;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h1{font-size:24px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 12px;color:var(--gold)}p,.hint{color:var(--muted);line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,button{font:inherit;width:100%;padding:12px;border-radius:10px}input{background:#0b1d2d;color:white;border:1px solid #456078}input[type=file]{padding:9px}button{margin-top:12px;border:0;background:var(--gold);color:#17202b;font-weight:800;cursor:pointer}button.secondary{background:#1a344b;color:var(--text);border:1px solid #456078}button:disabled{opacity:.55}
#status{white-space:pre-wrap;line-height:1.5;margin-top:12px}.hidden{display:none!important}.note{font-size:12px}
</style>
</head>
<body>
<main>
  <h1>ATINA · Imagens dos desafios</h1>
  <p>Área reservada à administração. Os ficheiros são enviados para o Supabase Storage.</p>
  <section class="panel" id="loginPanel">
    <h2>Entrar como administrador</h2>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="login">Entrar</button>
  </section>
  <section class="panel hidden" id="uploadPanel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <h2>Enviar imagem</h2><button class="secondary" id="logout" style="width:auto;margin:0">Sair</button>
    </div>
    <form id="uploadForm">
      <label for="challengeId">ID do desafio</label><input id="challengeId" type="number" min="0" step="1" required placeholder="Ex.: 12">
      <label for="imageFile">Imagem (JPEG, PNG ou WebP; máximo 10 MB)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" required>
      <label for="source">Origem da imagem</label><input id="source" required placeholder="Ex.: imagem original criada para ATINA">
      <label for="sourceUrl">URL da origem</label><input id="sourceUrl" type="url" required placeholder="https://…">
      <label for="author">Autor</label><input id="author" required placeholder="Nome do autor ou equipa">
      <label for="license">Licença / direitos</label><input id="license" required placeholder="Ex.: criação original ATINA">
      <label for="licenseUrl">URL da licença (opcional)</label><input id="licenseUrl" type="url" placeholder="https://…">
      <label for="attribution">Atribuição / crédito</label><input id="attribution" required placeholder="Crédito a apresentar, se aplicável">
      <button id="send" type="submit">Enviar imagem para o Supabase</button>
    </form>
    <p class="note">Após o envio, a imagem fica com estado “pendente de revisão”. O envio não a publica automaticamente no jogo.</p>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://qvvlqrgbtjujsejvenld.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dmxxcmdidGp1anNlanZlbmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODMzMDksImV4cCI6MjEwOTA1OTMwOX0.k_3Q05KxqmAByJgPxDyWeWPnYYfkrPxkRjd60Bntn6w";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const status = (message) => { $("status").textContent = message; };
  async function refreshSession() {
    const { data: { session } } = await client.auth.getSession();
    $("loginPanel").classList.toggle("hidden", !!session);
    $("uploadPanel").classList.toggle("hidden", !session);
  }
  $("login").addEventListener("click", async () => {
    status("A entrar…");
    const { error } = await client.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) { status("Não foi possível entrar: " + error.message); return; }
    await refreshSession(); status("Sessão iniciada. A autorização de administrador será confirmada no envio.");
  });
  $("logout").addEventListener("click", async () => {
    await client.auth.signOut(); await refreshSession(); status("Sessão terminada.");
  });
  $("uploadForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = $("send"); button.disabled = true; status("A enviar a imagem…");
    try {
      const { data: { session } } = await client.auth.getSession();
      if (!session) throw new Error("A sessão expirou. Entra novamente.");
      const file = $("imageFile").files[0];
      if (!file) throw new Error("Seleciona primeiro uma imagem.");
      const body = new FormData();
      body.append("challenge_id", $("challengeId").value);
      body.append("file", file);
      for (const [field, id] of [["source","source"],["source_url","sourceUrl"],["author","author"],["license","license"],["license_url","licenseUrl"],["attribution","attribution"]]) {
        body.append(field, $(id).value.trim());
      }
      const response = await fetch(SUPABASE_URL + "/functions/v1/atina-image-upload", {
        method: "POST",
        headers: { "Authorization": "Bearer " + session.access_token, "apikey": SUPABASE_ANON_KEY },
        body
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "O Supabase recusou o envio (HTTP " + response.status + ").");
      status("Imagem enviada com sucesso para o Supabase.\nDesafio: " + result.challenge_id + "\nEstado: pendente de revisão.\nFicheiro: " + result.storage_path);
      $("imageFile").value = "";
    } catch (error) { status(error.message || "Ocorreu um erro no envio."); }
    finally { button.disabled = false; }
  });
  refreshSession();
})();
</script>
</body>
</html>
