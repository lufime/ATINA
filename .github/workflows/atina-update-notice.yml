name: Aviso automático de alterações ATINA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'assets/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atina-update-notice
  cancel-in-progress: false

jobs:
  notify-players:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ativar aviso público
        run: |
          cat > atina-update-status.json <<'JSON'
          {
            "active": true,
            "message": "🛠️ Estamos a atualizar o ATINA. Poderão ocorrer interrupções temporárias. Obrigado pela paciência!",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atina-update-status.json
          git commit -m "Ativa aviso automático de atualização [skip ci]" || true
          git push

      - name: Aguardar publicação
        run: sleep 180

      - name: Desativar aviso após a atualização
        if: success()
        run: |
          cat > atina-update-status.json <<'JSON'
          {
            "active": false,
            "message": "",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git add atina-update-status.json
          git commit -m "Desativa aviso automático de atualização [skip ci]" || true
          git push
