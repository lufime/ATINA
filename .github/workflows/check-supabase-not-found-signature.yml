name: Detect Supabase pre-execution NOT_FOUND signature
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/fixtures/supabase-not-found-signature.json'
      - 'scripts/test-supabase-not-found-signature.mjs'
      - '.github/workflows/check-supabase-not-found-signature.yml'
      - '.atina-interno/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test synthetic log signature (offline, no credentials)
        run: node scripts/test-supabase-not-found-signature.mjs
