name: Deploy ATINA error-report Edge Functions (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY ATINA REPORT FUNCTIONS to authorize this production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-report-functions:
    if: inputs.confirmation == 'DEPLOY ATINA REPORT FUNCTIONS'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy report submit function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy atina-error-reports-submit --project-ref qvvlqrgbtjujsejvenld
      - name: Deploy reports admin function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy atina-error-reports-admin --project-ref qvvlqrgbtjujsejvenld

  reject-unconfirmed:
    if: inputs.confirmation != 'DEPLOY ATINA REPORT FUNCTIONS'
    runs-on: ubuntu-latest
    steps:
      - name: Reject deployment without exact confirmation
        run: |
          echo "Confirmation text did not match. No deployment was attempted."
          exit 1
