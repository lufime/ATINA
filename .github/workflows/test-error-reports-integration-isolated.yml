name: Testes de integração isolados — reports de erros

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar configuração e bloquear produção
        env:
          TEST_URL: ${{ secrets.ATINA_ERROR_REPORTS_TEST_URL }}
          ADMIN_TOKEN: ${{ secrets.ATINA_ERROR_REPORTS_TEST_ADMIN_TOKEN }}
          PLAYER_TOKEN: ${{ secrets.ATINA_ERROR_REPORTS_TEST_PLAYER_TOKEN }}
          ANON_KEY: ${{ secrets.ATINA_ERROR_REPORTS_TEST_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$TEST_URL" || { echo "::error::Falta ATINA_ERROR_REPORTS_TEST_URL"; exit 1; }
          test -n "$ADMIN_TOKEN" || { echo "::error::Falta ATINA_ERROR_REPORTS_TEST_ADMIN_TOKEN"; exit 1; }
          test -n "$PLAYER_TOKEN" || { echo "::error::Falta ATINA_ERROR_REPORTS_TEST_PLAYER_TOKEN"; exit 1; }
          test -n "$ANON_KEY" || { echo "::error::Falta ATINA_ERROR_REPORTS_TEST_ANON_KEY"; exit 1; }
          HOST="$(node -e "console.log(new URL(process.env.TEST_URL).hostname)" 2>/dev/null)" || { echo "::error::URL inválido"; exit 1; }
          if [ "$HOST" = "qvvlqrgbtjujsejvenld.supabase.co" ]; then
            echo "::error::O endpoint de produção está bloqueado para estes testes."
            exit 1
          fi
          echo "Configuração presente; hostname de produção bloqueado."
      - name: Executar testes de integração
        env:
          ATINA_ERROR_REPORTS_TEST_URL: ${{ secrets.ATINA_ERROR_REPORTS_TEST_URL }}
          ATINA_ERROR_REPORTS_TEST_ADMIN_TOKEN: ${{ secrets.ATINA_ERROR_REPORTS_TEST_ADMIN_TOKEN }}
          ATINA_ERROR_REPORTS_TEST_PLAYER_TOKEN: ${{ secrets.ATINA_ERROR_REPORTS_TEST_PLAYER_TOKEN }}
          ATINA_ERROR_REPORTS_TEST_ANON_KEY: ${{ secrets.ATINA_ERROR_REPORTS_TEST_ANON_KEY }}
          ATINA_ERROR_REPORTS_TEST_ALLOW_REMOTE: "true"
        run: node --test tests/error-report-backend.integration.test.cjs
