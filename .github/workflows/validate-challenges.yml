name: Validar banco de desafios

on:
  push:
    branches: [main, security/server-side-validation]
  pull_request:
    branches: [main]

concurrency:
  group: validate-challenges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-challenges:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar catálogo público sem respostas secretas
        run: node scripts/validate-public-challenges.mjs
      - name: Verificar sintaxe do gerador privado
        run: node --check scripts/generate-private-challenge-seed.mjs
      - name: Verificar sintaxe do validador privado
        run: node --check scripts/validate-challenges.mjs
      - name: Validar cliente server-authoritative e ausência de segredos
        run: node scripts/validate-server-client.mjs
      - name: Verificar sintaxe do cliente de jogo
        run: node --check atina-server-client.js
      - name: Verificar sintaxe do preparador de replay local
        run: node --check scripts/prepare-migration-replay.mjs
      - name: Testar motor de regras Detetive
        run: node scripts/validate-detective-engine.mjs
      - name: Validar progressão pseudónima e XP na nuvem
        run: node scripts/validate-cloud-progression.mjs
      - name: Validar animações de Mímicas nos modos local e online
        run: node scripts/validate-mimicas-animation.mjs
      - name: Validar animações globais no início e entre desafios
        run: node scripts/validate-global-challenge-animation.mjs
      - name: Validar missão diária e progressão do jogador
        run: node scripts/validate-daily-progression.mjs
      - name: Testar runtime de salas multiplayer (turnos, equipas e sincronização)
        run: node --test tests/network-room-runtime.test.cjs
      - name: Instalar Playwright para testes reais de browser
        run: npm install --no-save playwright
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar fluxos completos no browser
        timeout-minutes: 5
        run: node scripts/test-game-browser.mjs
