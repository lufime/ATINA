name: Validar banco de desafios

on:
  push:
    branches: [main, security/server-side-validation]
  pull_request:
    branches: [main]

jobs:
  validate-challenges:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar catálogo público sem respostas secretas
        run: node scripts/validate-public-challenges.mjs
      - name: Verificar sintaxe do gerador privado
        run: node --check scripts/generate-private-challenge-seed.mjs
      - name: Verificar sintaxe do validador privado
        run: node --check scripts/validate-challenges.mjs
      - name: Validar cliente server-authoritative e ausência de segredos
        run: node scripts/validate-server-client.mjs
