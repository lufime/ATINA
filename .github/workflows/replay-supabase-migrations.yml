name: Replay Supabase migrations

on:
  push:
    branches: [security/server-side-validation]
    paths:
      - 'supabase/**'
      - '.github/workflows/replay-supabase-migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/replay-supabase-migrations.yml'

concurrency:
  group: supabase-local-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize disposable local Supabase configuration
        run: |
          supabase init --force
          # Give Postgres and Studio dedicated non-default ports. Do not reuse
          # 54323 here: that is Supabase Studio's default port.
          sed -i '/^\[db\]/,/^\[/ s/^port = 54322$/port = 55322/' supabase/config.toml
          sed -i '/^\[studio\]/,/^\[/ s/^port = 54323$/port = 55323/' supabase/config.toml

      - name: Include isolated ATINA social-games migrations in disposable replay
        run: cp supabase/social-games/migrations/*.sql supabase/migrations/

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Replay every migration from an empty database
        run: supabase db reset --local --no-seed

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Run the complete pgTAP suite on the clean database
        run: |
          mkdir -p supabase/tests
          cp supabase/archive/proposals/*.test.sql supabase/tests/
          supabase test db --local
