name: Replay Supabase migrations

on:
  push:
    branches: [security/server-side-validation]
    paths:
      - 'supabase/**'
      - '.github/workflows/replay-supabase-migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/replay-supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-local-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Initialize disposable local Supabase configuration
        run: |
          supabase init --force
          # Give Postgres and Studio dedicated non-default ports. Do not reuse
          # 54323 here: that is Supabase Studio's default port.
          sed -i '/^\[db\]/,/^\[/ s/^port = 54322$/port = 55322/' supabase/config.toml
          sed -i '/^\[studio\]/,/^\[/ s/^port = 54323$/port = 55323/' supabase/config.toml

      - name: Normalize duplicate migration IDs in the disposable runner copy
        run: node scripts/prepare-migration-replay.mjs

      - name: Start disposable local Supabase stack (debug + one retry)
        shell: bash
        run: |
          set +e
          supabase start --debug
          first_status=$?
          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          echo "::warning::Supabase local stack failed on first attempt (exit $first_status); printing Docker diagnostics before retry."
          docker ps -a --no-trunc
          docker system df
          echo "Retrying once with debug logs..."
          sleep 10
          supabase start --debug
          exit $?

      - name: Print local stack diagnostics if startup failed
        if: failure()
        shell: bash
        run: |
          echo "=== Docker containers ==="
          docker ps -a --no-trunc || true
          echo "=== Docker disk usage ==="
          docker system df || true
          echo "=== Supabase status ==="
          supabase status || true
          echo "=== Supabase container logs (tail) ==="
          for container in $(docker ps -a --format '{{.Names}}' | grep '^supabase' || true); do
            echo "--- $container ---"
            docker logs --tail=120 "$container" 2>&1 || true
          done

      - name: Replay every migration from an empty database
        run: supabase db reset --local --no-seed

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Run the complete pgTAP suite on the clean database
        run: |
          mkdir -p supabase/tests
          cp supabase/archive/proposals/*.test.sql supabase/tests/
          supabase test db --local
