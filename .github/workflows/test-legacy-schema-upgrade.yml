name: Test legacy schema upgrade

on:
  push:
    branches: [qa/atina-multiplayer-rpc-browser-tests]
    paths:
      - 'tests/e2e/**'
      - 'supabase/migrations/**'
      - 'supabase/legacy-fixtures/**'
      - '.github/workflows/test-legacy-schema-upgrade.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/legacy-fixtures/**'
      - 'supabase/legacy-fixtures/legacy-upgrade-assertions.sql'
      - 'tests/e2e/**'
      - '.github/workflows/test-legacy-schema-upgrade.yml'
  workflow_dispatch:

concurrency:
  group: legacy-schema-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase stack
        run: |
          supabase init --force
          # Keep the disposable database empty: apply only the v2 compatibility
          # migrations and pseudonym progression migration after the legacy fixture.
          sed -i '/^\[db\.migrations\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          supabase start
      - name: Create synthetic legacy atina-ranking schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/atina-ranking-legacy.sql
      - name: Apply only the compatibility v2 migrations
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081358_atina_ranking_v2_local_sessions.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081410_atina_ranking_v2_multiplayer_mimicas.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101150000_atina_v2_local_mime_cards.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102120000_atina_progress_session_binding.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102125000_atina_xp_session_owner_player_index.sql
      - name: Seed deterministic local-only challenge fixtures
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/e2e/seed-local.sql
      - name: Exercise multiplayer and Mímicas RPCs from isolated browsers
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          node --test tests/e2e/multiplayer-rpc-browser.test.cjs
      - name: Assert legacy data and contracts remain intact
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/legacy-upgrade-assertions.sql
