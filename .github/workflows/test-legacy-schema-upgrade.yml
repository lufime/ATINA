name: Test legacy schema upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/legacy-fixtures/**'
      - 'supabase/legacy-fixtures/legacy-upgrade-assertions.sql'
      - '.github/workflows/test-legacy-schema-upgrade.yml'
  workflow_dispatch:

concurrency:
  group: supabase-local-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase stack
        run: |
          supabase init --force
          # Use a non-default port to avoid collisions on shared hosted runners.
          sed -i 's/port = 54322/port = 55422/' supabase/config.toml
          # Keep the disposable database empty: apply only the v2 compatibility
          # migrations and pseudonym progression migration after the legacy fixture.
          sed -i '/^\[db\.migrations\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          supabase start
      - name: Create synthetic legacy atina-ranking schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/atina-ranking-legacy.sql
      - name: Apply only the compatibility v2 migrations
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081358_atina_ranking_v2_local_sessions.sql
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081410_atina_ranking_v2_multiplayer_mimicas.sql
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101150000_atina_v2_local_mime_cards.sql
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102120000_atina_progress_session_binding.sql
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102125000_atina_xp_session_owner_player_index.sql
      - name: Assert legacy data and contracts remain intact
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55422/postgres" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/legacy-upgrade-assertions.sql
