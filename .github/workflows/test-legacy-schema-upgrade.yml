name: Test legacy schema upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/fixtures/**'
      - 'supabase/tests/legacy-upgrade-assertions.sql'
      - '.github/workflows/test-legacy-schema-upgrade.yml'
  workflow_dispatch:

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase stack
        run: |
          supabase init --force
          supabase start
      - name: Create synthetic legacy atina-ranking schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/atina-ranking-legacy.sql
      - name: Apply only the compatibility v2 migrations
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101120000_atina_ranking_v2_local_sessions.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101130000_atina_ranking_v2_multiplayer_mimicas.sql
      - name: Assert legacy data and contracts remain intact
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/legacy-upgrade-assertions.sql
