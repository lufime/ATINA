name: Test legacy schema upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/legacy-fixtures/**'
      - 'supabase/legacy-fixtures/legacy-upgrade-assertions.sql'
      - '.github/workflows/test-legacy-schema-upgrade.yml'
  workflow_dispatch:

concurrency:
  group: supabase-legacy-local-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_EXPERIMENTAL_STACK: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Start disposable local Supabase stack
        run: |
          supabase init --force
          supabase stack --help
          supabase start --exclude studio,mail
          supabase status --env --output-format text > "$RUNNER_TEMP/supabase.env"
          grep '^DB_URL=' "$RUNNER_TEMP/supabase.env" >> "$GITHUB_ENV"
      - name: Create synthetic legacy atina-ranking schema
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/atina-ranking-legacy.sql
      - name: Apply only the compatibility v2 migrations
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081358_atina_ranking_v2_local_sessions.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101081410_atina_ranking_v2_multiplayer_mimicas.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261101150000_atina_v2_local_mime_cards.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102120000_atina_progress_session_binding.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261102125000_atina_xp_session_owner_player_index.sql
      - name: Assert legacy data and contracts remain intact
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/legacy-fixtures/legacy-upgrade-assertions.sql
