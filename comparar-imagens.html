 function showDownloadLink(label,href,filename){const status=$("status");status.replaceChildren(document.createTextNode(label+" "));const link=document.createElement("a");link.href=href;link.textContent="⬇ TOCAR AQUI PARA GUARDAR O FICHEIRO";link.style.cssText="display:block;width:100%;box-sizing:border-box;text-align:center;margin:12px 0;padding:16px;background:#f2c14e;color:#17202b;border-radius:10px;font-size:17px;font-weight:900;text-decoration:none";link.setAttribute("download",filename);link.rel="noopener";status.append(link);status.scrollIntoView({behavior:"smooth",block:"center"})}
 async function downloadOne(a){try{const filename=originalName(a);say("A preparar o original do desafio "+a.challenge_id+"…");const blob=await fetchOriginal(a,filename);const url=window.URL.createObjectURL(blob);showDownloadLink("Original preparado ("+Math.round(blob.size/1024)+" KB). Toca no link para guardar o ficheiro:",url,filename)}catch(e){say("Falha no download: "+e.message)}}
async function downloadMany(items){const list=[...new Map(items.map(a=>[String(a.challenge_id),a])).values()];if(!list.length){say("Não existem imagens para descarregar. Confirma a seleção ou os filtros.");return}if(!confirm("Descarregar "+list.length+" originais, sem alterações, num ZIP?"))return;try{say("A preparar ZIP no servidor com "+list.length+" imagens…");const {data:{session:s}}=await sb.auth.getSession();if(!s)throw Error("A sessão terminou. Entra novamente.");const response=await fetch(URL+"/functions/v1/atina-image-manage",{method:"POST",headers:{Authorization:"Bearer "+s.access_token,apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({action:"download_zip",items:list.map(a=>({id:Number(a.challenge_id),filename:originalName(a)}))})});if(!response.ok){let detail="HTTP "+response.status;try{const j=await response.json();detail=j.error||j.detail||detail;if(j.details)detail+=" · "+j.details.join(" | ")}catch{}throw Error(detail)}const blob=await response.blob();if(!blob.size)throw Error("O servidor devolveu um ZIP vazio.");const count=response.headers.get("X-Images-Included")||list.length;const failed=response.headers.get("X-Images-Failed")||"0";const url=window.URL.createObjectURL(blob);showDownloadLink("ZIP preparado no servidor ("+Math.round(blob.size/1024)+" KB), com "+count+" imagens"+(failed!=="0"?" · Falhas: "+failed:"")+". Toca no link para guardar:",url,"ATINA_IMAGENS_ORIGINAIS.zip")}catch(e){say("Falha ao preparar ZIP: "+(e.message||String(e)))}}
async function bulkStatus(action,items,label,question){if(!items.length){say("Não existem imagens elegíveis.");return}if(!confirm(question+"\\nTotal: "+items.length))return;let ok=0;const errors=[];for(const a of items){try{say(label+" "+(ok+1)+"/"+items.length+" · ID "+a.challenge_id);await invoke({action,challenge_id:Number(a.challenge_id)});ok++}catch(e){errors.push("ID "+a.challenge_id+": "+e.message)}}say(label+" concluído: "+ok+"/"+items.length+(errors.length?"\\nFalhas:\\n"+errors.join("\\n"):""));await refresh()}
$("approveAll").addEventListener("click",()=>bulkStatus("approve",assets.filter(a=>["pending","generated"].includes(String(a.status||"").toLowerCase())),"Aprovação","Aprovar todas as imagens pendentes e geradas?"));
$("publishAll").addEventListener("click",()=>bulkStatus("publish",assets.filter(a=>a.status==="approved"),"Publicação","Publicar todas as imagens já aprovadas no jogo?"));
$("downloadSelected").addEventListener("click",()=>downloadMany(assets.filter(a=>selectedChallenges.has(String(a.challenge_id)))));$("downloadVisible").addEventListener("click",()=>downloadMany(currentFiltered));$("selectVisible").addEventListener("change",e=>{for(const a of currentFiltered){const id=String(a.challenge_id);if(e.target.checked)selectedChallenges.add(id);else selectedChallenges.delete(id)}render()});
$("deleteSelected").addEventListener("click",async()=>{const ids=[...selectedChallenges];if(!ids.length){say("Seleciona primeiro uma ou mais imagens.");return}if(!confirm("Apagar "+ids.length+" imagem(ns) selecionada(s), incluindo os respetivos ficheiros? Esta ação não pode ser anulada."))return;try{for(const id of ids)await invoke({action:"delete",challenge_id:Number(id)});selectedChallenges.clear();say(ids.length+" imagem(ns) apagada(s).");await refresh()}catch(e){say("A operação parou: "+(e.message||"erro ao apagar"));await refresh()}});
$("deleteVisible").addEventListener("click",async()=>{const ids=[...new Set(currentFiltered.map(a=>String(a.challenge_id)))];if(!ids.length){say("Não há imagens visíveis para apagar.");return}if(!confirm("ATENÇÃO: apagar TODAS as "+ids.length+" imagens atualmente visíveis (respeitando os filtros), incluindo ficheiros? Esta ação não pode ser anulada."))return;try{for(const id of ids)await invoke({action:"delete",challenge_id:Number(id)});ids.forEach(id=>selectedChallenges.delete(id));say(ids.length+" imagem(ns) visível(is) apagada(s).");await refresh()}catch(e){say("A operação parou: "+(e.message||"erro ao apagar"));await refresh()}});
$("clearFilters").addEventListener("click",()=>{$("searchImages").value="";$("filterAuthor").value="";$("filterLicense").value="";$("filterStatus").value="";$("filterType").value="";$("filterQuality").value="";$("sortImages").value="id";render()});
sb.auth.getSession().then(({data})=>{if(data.session){$("login").style.display="none";refresh()}});
})();
</script></body></html>
