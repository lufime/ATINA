<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATINA — Gestão de imagens</title>
<style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#14243a;--line:#36516e;--gold:#d3ad68;--text:#f3f0e8;--muted:#aab6c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3049,#0b1421 65%);color:var(--text);font:16px system-ui,sans-serif;padding:18px 12px}main{max-width:1050px;margin:auto}a{color:var(--gold)}h1{font-size:24px}p{color:var(--muted);line-height:1.5}.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.asset{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0}.asset-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,1fr);gap:16px}.asset img{width:100%;max-height:340px;object-fit:contain;background:#07111d;border-radius:10px}.solution-label{margin:0 0 10px;padding:11px 12px;border:1px solid var(--gold);border-radius:10px;background:#0b1d2d;line-height:1.45;overflow-wrap:anywhere}.solution-label strong{color:var(--gold)}.image-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px;padding:11px;background:#0b1d2d;border:1px solid var(--line);border-radius:10px}.detail{min-width:0}.detail strong{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.detail span{display:block;color:var(--text);font-size:13px;overflow-wrap:anywhere}.detail.wide{grid-column:1/-1}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.filebtn{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;background:var(--gold);color:#17202b;cursor:pointer}button.secondary{background:#1a344b;color:var(--text);border:1px solid #456078}button.danger{background:#8e343d;color:white}button:disabled{opacity:.5}.editor{display:none;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.editor.open{display:block}.editor canvas{width:100%;max-height:360px;object-fit:contain;background:#07111d;border-radius:10px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.controls label{font-size:13px;color:var(--muted)}input[type=range],select{width:100%}input[type=file]{max-width:100%}#status{white-space:pre-wrap;color:var(--gold);margin:14px 0}@media(max-width:650px){.asset-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div><h1>ATINA · Gestão de imagens</h1><p>Rever, aprovar, apagar e preparar imagens para os desafios do jogo.</p></div><a href="admin-images.html">← Voltar à administração</a></div>
<section id="login" class="asset"><h2>Entrar como administrador</h2><p>Usa a mesma conta de administração da página de envio.</p><input id="email" type="email" placeholder="Email" autocomplete="username" style="padding:10px;width:100%;margin:6px 0"><input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password" style="padding:10px;width:100%;margin:6px 0"><button id="signin">Entrar</button></section>
<section id="filters" class="asset" style="display:none">
<h2>Pesquisar e filtrar imagens</h2>
<div class="controls">
<label>Pesquisar por ID, autor ou origem<input id="searchImages" type="search" placeholder="Ex.: 25, Einstein, Wikimedia" style="width:100%;padding:10px;margin-top:6px"></label>
<label>Estado<select id="filterStatus" style="padding:10px;margin-top:6px"><option value="">Todos os estados</option><option value="pending">Pendente</option><option value="approved">Aprovada</option><option value="rejected">Rejeitada</option><option value="broken">Com erro</option><option value="generated">Gerada</option><option value="published">Publicado</option></select></label>
<label>Autor<input id="filterAuthor" type="search" placeholder="Pesquisar autor" style="width:100%;padding:10px;margin-top:6px"></label>
<label>Licença / utilização<select id="filterLicense" style="padding:10px;margin-top:6px"><option value="">Todas as licenças</option><option value="reusable">Pode reutilizar (CC0, domínio público, CC BY, CC BY-SA)</option><option value="restricted">Direitos reservados / não confirmada</option></select></label>
<label>Tipo de ficheiro<select id="filterType" style="padding:10px;margin-top:6px"><option value="">Todos os formatos</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
<label>Qualidade da imagem<select id="filterQuality" style="padding:10px;margin-top:6px"><option value="">Todas as qualidades</option><option value="Muito alta">Muito alta</option><option value="Alta">Alta</option><option value="Boa">Boa</option><option value="Média">Média</option><option value="Baixa">Baixa</option></select></label>
<label>Ordenar por<select id="sortImages" style="padding:10px;margin-top:6px"><option value="id">ID do desafio</option><option value="newest">Mais recentes</option><option value="largest">Maior tamanho</option><option value="smallest">Menor tamanho</option></select></label>
</div><p id="filterCount" class="meta"></p><button id="clearFilters" class="secondary" type="button">Limpar filtros</button>
</section>
<div id="gallery"></div><div id="status" role="status" aria-live="polite"></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const URL="https://qvvlqrgbtjujsejvenld.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dmxxcmdidGp1anNlanZlbmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0ODMzMDksImV4cCI6MjEwOTA1OTMwOX0.k_3Q05KxqmAByJgPxDyWeWPnYYfkrPxkRjd60Bntn6w",sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),gallery=$("gallery");
const say=s=>$("status").textContent=s;let session=null,assets=[];
async function invoke(body){const {data:{session:s}}=await sb.auth.getSession();if(!s)throw Error("A sessão terminou. Entra novamente.");const r=await fetch(URL+"/functions/v1/atina-image-manage",{method:"POST",headers:{Authorization:"Bearer "+s.access_token,apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Erro na operação.");return j}
async function refresh(){say("A carregar imagens…");try{const j=await invoke({action:"list"});assets=j.assets||[];await Promise.all(assets.map(a=>new Promise(resolve=>{const probe=new Image();probe.onload=()=>{const px=probe.naturalWidth*probe.naturalHeight;a._quality=px>=8000000?"Muito alta":px>=2000000?"Alta":px>=1000000?"Boa":px>=400000?"Média":"Baixa";resolve()};probe.onerror=()=>{a._quality="";resolve()};probe.src=a.image_url})));$("filters").style.display="block";render();say(assets.length+" imagens registadas.");}catch(e){say(e.message)}}
function render(){gallery.replaceChildren();if(!assets.length){gallery.textContent="Não existem imagens registadas.";return}
const term=$("searchImages").value.trim().toLocaleLowerCase("pt-PT"),status=$("filterStatus").value,type=$("filterType").value,quality=$("filterQuality").value,sort=$("sortImages").value;
const authorTerm=$("filterAuthor").value.trim().toLocaleLowerCase("pt-PT"),licenseMode=$("filterLicense").value;
const isReusableLicense=value=>{const x=String(value||"").toLowerCase();return x==="cc0 1.0"||x.includes("public domain")||/^cc by(?:-sa)?\\s/i.test(x)};
let filtered=assets.filter(a=>(!term||[a.challenge_id,a.author,a.source,a.attribution,a.license,a.storage_path].join(" ").toLocaleLowerCase("pt-PT").includes(term))&&(!authorTerm||String(a.author||"").toLocaleLowerCase("pt-PT").includes(authorTerm))&&(!status||(status==="published"?a.status==="published":a.status===status))&&(!type||a.mime_type===type)&&(!quality||a._quality===quality)&&(!licenseMode||(licenseMode==="reusable"?isReusableLicense(a.license):!isReusableLicense(a.license))));
filtered.sort((a,b)=>sort==="newest"?new Date(b.created_at)-new Date(a.created_at):sort==="largest"?(Number(b.file_size_bytes)||0)-(Number(a.file_size_bytes)||0):sort==="smallest"?(Number(a.file_size_bytes)||0)-(Number(b.file_size_bytes)||0):a.challenge_id-b.challenge_id);
$("filterCount").textContent="A mostrar "+filtered.length+" de "+assets.length+" imagens.";
if(!filtered.length){gallery.textContent="Não foram encontradas imagens com estes filtros.";return}
for(const a of filtered){const card=document.createElement("section");card.className="asset";const h=document.createElement("h2");const isPublished=a.status==="published"||(a.status==="approved"&&a.solution_image_url===a.image_url);const displayStatus=isPublished?"Publicado":a.status==="approved"?"Aprovado":a.status==="pending"?"Pendente":a.status==="rejected"?"Rejeitado":a.status==="broken"?"Com erro":a.status==="generated"?"Gerado":a.status;h.textContent="Desafio "+a.challenge_id+" · "+displayStatus;const grid=document.createElement("div");grid.className="asset-grid";const left=document.createElement("div");const solution=document.createElement("div");solution.className="solution-label";const solutionTitle=document.createElement("strong");solutionTitle.textContent="Solução: ";const solutionText=document.createElement("span");solutionText.textContent=a.solution||"Não definida";solution.append(solutionTitle,solutionText);left.append(solution);const img=document.createElement("img");img.src=a.image_url;img.alt="Imagem do desafio "+a.challenge_id;left.append(img);
const details=document.createElement("div");details.className="image-details";
const addDetail=(label,value,wide=false)=>{const d=document.createElement("div");d.className="detail"+(wide?" wide":"");const strong=document.createElement("strong");strong.textContent=label;const span=document.createElement("span");span.textContent=value||"—";d.append(strong,span);details.append(d);return span};
addDetail("Tamanho",a.file_size_bytes!=null?(Number(a.file_size_bytes)/1048576).toFixed(2)+" MB ("+Number(a.file_size_bytes).toLocaleString("pt-PT")+" bytes)":"Não registado");
addDetail("Autor",a.author||"Não indicado");
addDetail("Tipo de ficheiro",a.mime_type||"Não identificado");
const dimensions=addDetail("Resolução / qualidade","A verificar…");
addDetail("Data de envio",a.created_at?new Date(a.created_at).toLocaleString("pt-PT"):"Não registada");
addDetail("Licença",a.license||"Não indicada",true);
addDetail("Crédito / atribuição",a.attribution||"Não indicado",true);
img.addEventListener("load",()=>{const w=img.naturalWidth,h=img.naturalHeight;const mp=(w*h/1000000).toFixed(2);const grade=(w*h>=8000000?"Muito alta":w*h>=2000000?"Alta":w*h>=1000000?"Boa":w*h>=400000?"Média":"Baixa");dimensions.textContent=w+" × "+h+" px · "+mp+" MP · "+grade;});
img.addEventListener("error",()=>{dimensions.textContent="Não foi possível ler a resolução";});
left.append(details);const right=document.createElement("div");const info=document.createElement("p");info.className="meta";info.textContent="Origem: "+(a.source||"—")+"\nLicença: "+(a.license||"—")+"\nFicheiro: "+(a.storage_path||"URL externa")+"\nEstado de publicação: "+(isPublished?"Publicado no jogo":a.status==="approved"?"Aprovado — por publicar":"Ainda não publicado");right.append(info);
const actions=document.createElement("div");actions.className="actions";
const approve=btn("✓ Confirmar / disponibilizar","",async()=>{if(!confirm("Confirmar esta imagem para o jogo?"))return;await invoke({action:"approve",challenge_id:a.challenge_id});say("Imagem aprovada.");await refresh()});
const publish=btn("↗ Publicar no jogo","",async()=>{if(a.status!=="approved"){say("Confirma primeiro a imagem antes de publicar.");return}if(!confirm("Publicar esta imagem como imagem da solução do desafio "+a.challenge_id+"?"))return;await invoke({action:"publish",challenge_id:a.challenge_id});say("Imagem publicada para o desafio "+a.challenge_id+".");await refresh()});publish.disabled=a.status!=="approved";approve.disabled=a.status==="published";
const edit=btn("✎ Editar imagem","secondary",()=>editor.classList.toggle("open"));
const del=btn("Apagar da base de dados","danger",async()=>{if(!confirm("Apagar o registo e o ficheiro desta imagem do armazenamento? Esta ação não pode ser anulada."))return;await invoke({action:"delete",challenge_id:a.challenge_id});say("Imagem apagada.");await refresh()});
actions.append(approve,publish,edit,del);right.append(actions);grid.append(left,right);card.append(h,grid);
const editor=document.createElement("div");editor.className="editor";const intro=document.createElement("p");intro.textContent="Escolhe uma imagem ou edita a atual. Podes recortar ao centro, rodar e ajustar brilho/contraste antes de a guardar.";const file=document.createElement("input");file.type="file";file.accept="image/jpeg,image/png,image/webp";const canvas=document.createElement("canvas");const ctx=canvas.getContext("2d");const controls=document.createElement("div");controls.className="controls";
function range(label,min,max,value){const wrap=document.createElement("label");wrap.textContent=label;const r=document.createElement("input");r.type="range";r.min=min;r.max=max;r.value=value;r.addEventListener("input",draw);wrap.append(r);controls.append(wrap);return r}
const rotation=range("Rotação",-180,180,0),zoom=range("Recorte / zoom",100,250,100),brightness=range("Brilho",50,150,100),contrast=range("Contraste",50,150,100);
const save=btn("Guardar imagem editada","",async()=>{try{const blob=await new Promise(ok=>canvas.toBlob(ok,"image/jpeg",.92));if(!blob)throw Error("Não foi possível preparar a imagem.");const edited=new File([blob],""+a.challenge_id+"-atina-editada.jpg",{type:"image/jpeg"});const {data:{session:s}}=await sb.auth.getSession();const body=new FormData();body.append("challenge_id",String(a.challenge_id));body.append("file",edited);body.append("source","Imagem editada para o jogo ATINA");body.append("source_url","gerada-por-ia://chatgpt");body.append("author",a.author||"Administração ATINA");body.append("license",a.license||"Confirmar licença antes de publicação");body.append("attribution",a.attribution||"Administração ATINA");say("A enviar versão editada…");const resp=await fetch(URL+"/functions/v1/atina-image-upload",{method:"POST",headers:{Authorization:"Bearer "+s.access_token,apikey:KEY},body});const result=await resp.json();if(!resp.ok)throw Error(result.error||"Falha no envio.");say("Imagem substituída. Estado pendente: confirma-a depois da revisão.");await refresh()}catch(e){say(e.message)}});
function btn(label,kind,fn){const b=document.createElement("button");b.textContent=label;if(kind)b.className=kind;b.addEventListener("click",async()=>{b.disabled=true;try{await fn()}catch(e){say(e.message)}finally{b.disabled=false}});return b}
let sourceImage=new Image();function draw(){if(!sourceImage.src)return;const w=sourceImage.naturalWidth,h=sourceImage.naturalHeight,angle=Number(rotation.value)*Math.PI/180,scale=Math.max(1,Number(zoom.value)/100);const bound=Math.ceil(Math.max(w,h)*scale*1.5);canvas.width=Math.min(1800,bound);canvas.height=Math.round(canvas.width*(h/w));ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(angle);const fit=Math.max(canvas.width/w,canvas.height/h)*scale;ctx.filter="brightness("+brightness.value+"%) contrast("+contrast.value+"%)";ctx.drawImage(sourceImage,-w*fit/2,-h*fit/2,w*fit,h*fit);ctx.restore();ctx.filter="none"}
file.addEventListener("change",()=>{const f=file.files[0];if(!f)return;sourceImage=new Image();sourceImage.onload=draw;sourceImage.src=URL.createObjectURL(f)});
sourceImage.onload=draw;sourceImage.src=a.image_url;editor.append(intro,file,canvas,controls,save);card.append(editor);gallery.append(card)}
}
$("signin").addEventListener("click",async()=>{say("A iniciar sessão…");const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){say(error.message);return}$("login").style.display="none";await refresh()});
["searchImages","filterAuthor","filterLicense","filterStatus","filterType","filterQuality","sortImages"].forEach(id=>$(id).addEventListener(id==="searchImages"?"input":"change",render));
$("clearFilters").addEventListener("click",()=>{$("searchImages").value="";$("filterAuthor").value="";$("filterLicense").value="";$("filterStatus").value="";$("filterType").value="";$("filterQuality").value="";$("sortImages").value="id";render()});
sb.auth.getSession().then(({data})=>{if(data.session){$("login").style.display="none";refresh()}});
})();
</script></body></html>
